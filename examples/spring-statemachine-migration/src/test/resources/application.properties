quarkus.http.test-port=0

# The test uses the in-memory connector, so no Kafka broker is needed
quarkus.kafka.devservices.enabled=false

# Swap Kafka for the SmallRye in-memory connector so the test runs with no Docker
mp.messaging.incoming.flow-in.connector=smallrye-in-memory
mp.messaging.outgoing.flow-out.connector=smallrye-in-memory
mp.messaging.outgoing.flow-in-outgoing.connector=smallrye-in-memory

quarkus.log.category."io.quarkiverse.flow".level=WARN
quarkus.flow.tracing.enabled=false
