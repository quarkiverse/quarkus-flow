name: Update Knowledge Graph

on:
  workflow_dispatch: # Manual trigger
  release:
    types: [published] # Auto-update on releases

jobs:
  update-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push changes

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        name: Create GitHub App Token
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history for proper git operations
          token: ${{ steps.app-token.outputs.token }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure Git author
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: '.github/workflows/graphify/requirements.txt'

      - name: Install graphify
        run: |
          pip install -r .github/workflows/graphify/requirements.txt
          graphify --version || echo "Graphify installed"

      - name: Cache graphify AST extractions
        uses: actions/cache@v4
        with:
          path: .graphify/cache
          key: graphify-cache-${{ runner.os }}-${{ hashFiles('**/*.java', '**/*.yaml', '**/*.yml', '**/*.adoc', '**/*.md') }}
          restore-keys: |
            graphify-cache-${{ runner.os }}-

      - name: Update knowledge graph
        run: |
          # Run incremental update (uses cache, only re-extracts changed files)
          python3 -c "
          from graphify.detect import detect
          from pathlib import Path
          import json

          # Quick detection to check if there's work to do
          result = detect(Path('.'))
          print(f'Detected {result[\"total_files\"]} files to process')
          " || true

          # Run the actual update
          graphify update .
        env:
          # No API keys needed - AST extraction is free, semantic uses host agent
          PYTHONUNBUFFERED: '1'

      - name: Check for graph changes
        id: check_changes
        run: |
          git diff --quiet .graphify/ .graphify_manifest.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated graph
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          # Add only the graph artifacts (not cache or temp files)
          git add .graphify/graph.json
          git add .graphify/GRAPH_REPORT.md
          git add .graphify_manifest.json
          # NOTE: .graphify/cache/ is now ignored and cached via GitHub Actions

          # Create commit
          git commit -m "chore: update knowledge graph [skip ci]

          Auto-update triggered by ${{ github.event.head_commit.message }}

          Graph statistics:
          - See .graphify/GRAPH_REPORT.md for details
          - Updated by GitHub Actions workflow"

          # Pull and rebase to handle concurrent pushes
          git pull --rebase origin main

          # Push changes
          git push

      - name: Summary
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          echo "✅ Knowledge graph updated and committed"
          echo "📊 See .graphify/GRAPH_REPORT.md for updated statistics"

      - name: No changes
        if: steps.check_changes.outputs.changed != 'true'
        run: |
          echo "ℹ️ Knowledge graph is already up to date"
