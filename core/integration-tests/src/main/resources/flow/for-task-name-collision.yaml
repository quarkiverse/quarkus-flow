document:
  dsl: '1.0.0'
  namespace: flow
  name: for-task-name-collision
  version: '1.0.0'
do:
  - dispatchTasks:
      for:
        in: .items
        each: task
        at: index
      do:
        - emitTask:
            emit:
              event:
                with:
                  type: flow.it.task.dispatch.v1
                  source: reflection-repro
                  data:
                    taskName: '${ $task.name }'
