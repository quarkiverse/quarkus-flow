quarkus.log.min-level=INFO
quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=INFO
quarkus.log.category."org.jboss.resteasy.reactive.client".level=INFO
quarkus.log.category."io.vertx".level=INFO
quarkus.log.category."dev.langchain4j".level=INFO

# No test in this module asserts on LLM output anymore: agentic behavior is
# covered by the langchain4j module's WireMock-mocked ITs. The Ollama dev
# service must never start here (it would pull a multi-GB model).
quarkus.langchain4j.ollama.devservices.enabled=false

# Enable the extension's metrics logic
quarkus.flow.metrics.enabled=true

quarkus.http.test-port=0