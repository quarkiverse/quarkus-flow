quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Default datasource - used by Hibernate ORM / JPA, and by the app's own Flyway migration
# below (db/migration) for the test-fixture "alert" table. Provisioned by Dev Services.
quarkus.datasource.db-kind=postgresql

quarkus.flyway.migrate-at-start=true

# Named "flow-runtime" datasource - isolated Flyway migration history/location for the Flow
# persistence schema. Quarkus Dev Services cannot share one container across two datasources
# (confirmed: https://github.com/quarkusio/quarkus/discussions/31655), so instead of
# provisioning its own container, this datasource is pointed explicitly at whatever the
# default datasource above resolves to - guaranteeing both hit the same physical database.
quarkus.datasource.flow-runtime.db-kind=postgresql
quarkus.datasource.flow-runtime.devservices.enabled=false
quarkus.datasource.flow-runtime.jdbc.url=${quarkus.datasource.jdbc.url}
quarkus.datasource.flow-runtime.username=${quarkus.datasource.username}
quarkus.datasource.flow-runtime.password=${quarkus.datasource.password}

quarkus.flyway.flow-runtime.table=flyway_flow_runtime_history
quarkus.flyway.flow-runtime.migrate-at-start=true
quarkus.flyway.flow-runtime.locations=db/flow-migration/runtime/postgresql
# The "public" schema already has content from the app's own (default) Flyway migration above,
# since both datasources share one physical database. Flyway refuses to migrate a non-empty
# schema it doesn't recognize unless baselined; baseline-version=0 keeps it below V1.0.0 so
# that migration still gets applied normally right after baselining.
quarkus.flyway.flow-runtime.baseline-on-migrate=true
quarkus.flyway.flow-runtime.baseline-version=0
