quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1

# Named "flow-runtime" datasource: isolated Flyway migration history/location, pointed at the
# same explicit URL as the default datasource above.
quarkus.datasource.flow-runtime.db-kind=h2
%test.quarkus.datasource.flow-runtime.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1

quarkus.flyway.flow-runtime.table=flyway_flow_runtime_history
quarkus.flyway.flow-runtime.locations=db/flow-migration/runtime/h2
quarkus.flyway.flow-runtime.migrate-at-start=true

# MySQL - Dev Services run on the default datasource only; "flow-runtime" is pointed at
# whatever connection gets resolved for it (there is no supported mechanism to make two named
# datasources share one Dev Services container - see https://github.com/quarkusio/quarkus/issues/26215).
%mysql.quarkus.datasource.db-kind=mysql
%mysql.quarkus.datasource.flow-runtime.db-kind=mysql
%mysql.quarkus.datasource.flow-runtime.devservices.enabled=false
%mysql.quarkus.datasource.flow-runtime.jdbc.url=${quarkus.datasource.jdbc.url}
%mysql.quarkus.datasource.flow-runtime.username=${quarkus.datasource.username}
%mysql.quarkus.datasource.flow-runtime.password=${quarkus.datasource.password}
%mysql.quarkus.flyway.flow-runtime.locations=db/flow-migration/runtime/mysql

# PostgreSQL - same single-container approach as MySQL above.
%postgresql.quarkus.datasource.db-kind=postgresql
%postgresql.quarkus.datasource.flow-runtime.db-kind=postgresql
%postgresql.quarkus.datasource.flow-runtime.devservices.enabled=false
%postgresql.quarkus.datasource.flow-runtime.jdbc.url=${quarkus.datasource.jdbc.url}
%postgresql.quarkus.datasource.flow-runtime.username=${quarkus.datasource.username}
%postgresql.quarkus.datasource.flow-runtime.password=${quarkus.datasource.password}
%postgresql.quarkus.flyway.flow-runtime.locations=db/flow-migration/runtime/postgresql

# Oracle - same single-container approach as MySQL above.
%oracle.quarkus.datasource.db-kind=oracle
%oracle.quarkus.datasource.flow-runtime.db-kind=oracle
%oracle.quarkus.datasource.flow-runtime.devservices.enabled=false
%oracle.quarkus.datasource.flow-runtime.jdbc.url=${quarkus.datasource.jdbc.url}
%oracle.quarkus.datasource.flow-runtime.username=${quarkus.datasource.username}
%oracle.quarkus.datasource.flow-runtime.password=${quarkus.datasource.password}
%oracle.quarkus.flyway.flow-runtime.locations=db/flow-migration/runtime/oracle

# MSSQL - same single-container approach as MySQL above.
%mssql.quarkus.datasource.db-kind=mssql
%mssql.quarkus.datasource.flow-runtime.db-kind=mssql
%mssql.quarkus.datasource.flow-runtime.devservices.enabled=false
%mssql.quarkus.datasource.flow-runtime.jdbc.url=${quarkus.datasource.jdbc.url}
%mssql.quarkus.datasource.flow-runtime.username=${quarkus.datasource.username}
%mssql.quarkus.datasource.flow-runtime.password=${quarkus.datasource.password}
%mssql.quarkus.flyway.flow-runtime.locations=db/flow-migration/runtime/mssql
