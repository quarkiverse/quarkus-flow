quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.datasource=flow-runtime

# Use a single named "flow-runtime" datasource for both Hibernate ORM and Flyway.
# This is important for container-based Dev Services: defining a default datasource and a named
# datasource causes Quarkus to provision one Dev Service per datasource. Pointing Hibernate's
# default persistence unit at "flow-runtime" guarantees that Hibernate validation and Flyway
# migration operate on the same physical database.
#
# DB_CLOSE_DELAY=-1 keeps H2's in-memory DB alive between connections. Do not
# set DATABASE_TO_UPPER=false here: H2's JDBC driver reports storesUpperCaseIdentifiers()=true
# regardless of that setting, and Hibernate ORM's schema validator relies on that metadata to
# case-fold its catalog/table lookups - DATABASE_TO_UPPER=false makes the actual stored
# identifiers lowercase while Hibernate still looks for the uppercase form, so schema
# validation fails to find anything. Leaving H2 on its default (uppercase) identifier handling
# keeps the script's unquoted lowercase names and Hibernate's lookups consistently folded.
quarkus.datasource.flow-runtime.db-kind=h2
%test.quarkus.datasource.flow-runtime.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1

quarkus.flyway.flow-runtime.table=flyway_flow_runtime_history
quarkus.flyway.flow-runtime.locations=db/flow-migration/runtime/h2
quarkus.flyway.flow-runtime.migrate-at-start=true

# MySQL
%mysql.quarkus.datasource.flow-runtime.db-kind=mysql
%mysql.quarkus.flyway.flow-runtime.locations=db/flow-migration/runtime/mysql

# PostgreSQL
%postgresql.quarkus.datasource.flow-runtime.db-kind=postgresql
%postgresql.quarkus.flyway.flow-runtime.locations=db/flow-migration/runtime/postgresql

# Oracle
%oracle.quarkus.datasource.flow-runtime.db-kind=oracle
%oracle.quarkus.datasource.flow-runtime.devservices.db-name=flowruntime
%oracle.quarkus.flyway.flow-runtime.locations=db/flow-migration/runtime/oracle

# MSSQL
%mssql.quarkus.datasource.flow-runtime.db-kind=mssql
%mssql.quarkus.flyway.flow-runtime.locations=db/flow-migration/runtime/mssql
