# Quartz configuration - jdbc-cmt store backed by the named "flow-quartz" datasource, whose
# schema is migrated by the quarkus-flow-db-migration-quartz extension (see that module's
# runtime dependency below).
quarkus.quartz.store-type=jdbc-cmt
quarkus.quartz.datasource=flow-quartz
quarkus.quartz.misfire-policy.task-job=ignore-misfire-policy

quarkus.datasource.flow-quartz.db-kind=postgresql

# flyway configuration - this Testcontainers-provisioned database is always empty, so no
# baseline is needed (see the Database Schema Migration guide's Upgrading an existing database
# section for the populated-database case, which does need one).
quarkus.flyway.flow-quartz.connect-retries=10
quarkus.flyway.flow-quartz.table=flyway_flow_quartz_history
quarkus.flyway.flow-quartz.locations=db/flow-migration/quartz
quarkus.flyway.flow-quartz.migrate-at-start=true
