document:
  dsl: '1.0.0'
  namespace: otel
  name: otel-http-simple
  version: '1.0.0'
do:
  - callEcho1:
      call: http
      with:
        method: post
        endpoint: '${ $workflow.input.baseUrl + "/http-echo/one" }'
        body:
          message: one
  - callEcho2:
      call: http
      with:
        method: post
        endpoint: '${ $workflow.input.baseUrl + "/http-echo/two" }'
        body:
          message: two
