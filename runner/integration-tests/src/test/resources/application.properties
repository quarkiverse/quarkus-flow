# The quarkus-kubernetes-client extension (TokenReview transport, issue #1160)
# starts a Dev Services k3s container at BUILD time when no Kubernetes
# configuration is present — runtime overrides from test profiles cannot
# prevent it. The Kubernetes-related ITs mock the kube-apiserver with WireMock,
# and nothing in this module uses a real cluster, so the dev service must never
# start or require Docker.
quarkus.kubernetes-client.devservices.enabled=false
