# The quarkus-kubernetes-client extension (TokenReview transport, issue #1160)
# starts a Dev Services k3s container when no Kubernetes configuration is
# present. Unit tests in this module point the client at WireMock explicitly,
# so the dev service must never start — and must not require Docker.
# NOTE: this property is BUILD-TIME config; QuarkusTestProfile.getConfigOverrides()
# cannot set it, which is why it lives here.
quarkus.kubernetes-client.devservices.enabled=false
